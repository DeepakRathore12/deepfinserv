name: Deploy
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production # add required reviewers on this environment in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://deepfinserv.in
          NEXT_PUBLIC_ALLOW_INDEXING: 'true'
          NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        run: pnpm -r build
      - name: Package release
        run: |
          pnpm --filter @dk/backend deploy --prod --legacy release/apps/backend
          cp -r apps/backend/dist release/apps/backend/dist
          mkdir -p release/apps/frontend/.next
          cp -r apps/frontend/.next/standalone release/apps/frontend/.next/standalone
          cp -r apps/frontend/.next/static release/apps/frontend/.next/standalone/apps/frontend/.next/static
          cp ecosystem.config.cjs release/
          tar -czf release.tgz -C release .
      - name: Ship and activate
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          echo "$KNOWN_HOSTS" > known_hosts
          scp -i key -o UserKnownHostsFile=known_hosts release.tgz infra/scripts/deploy.sh dkfinance@"$HOST":/tmp/
          ssh -i key -o UserKnownHostsFile=known_hosts dkfinance@"$HOST" 'bash /tmp/deploy.sh /tmp/release.tgz && rm /tmp/release.tgz'
