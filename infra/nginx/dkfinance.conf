# /etc/nginx/sites-available/dkfinance.conf on the EC2 host.
# TLS certificates from certbot (Let's Encrypt) or terminate TLS at an AWS ALB and drop the 443 block.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=forms:10m rate=30r/m;

upstream dk_web { server 127.0.0.1:3000; keepalive 32; }
upstream dk_api { server 127.0.0.1:4000; keepalive 16; }

server {
  listen 80;
  listen [::]:80;
  server_name deepfinserv.in www.deepfinserv.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://deepfinserv.in$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.deepfinserv.in;
  ssl_certificate     /etc/letsencrypt/live/deepfinserv.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/deepfinserv.in/privkey.pem;
  return 301 https://deepfinserv.in$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name deepfinserv.in;

  ssl_certificate     /etc/letsencrypt/live/deepfinserv.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/deepfinserv.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  server_tokens off;
  client_max_body_size 128k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Lender logo uploads are up to 200 KB; everything else keeps the small limit above.
  location ~ ^/api/v1/admin/lenders/[^/]+/logo$ {
    client_max_body_size 256k;
    proxy_pass http://dk_api;
  }
  # Writes that create records or send SMS get a tighter edge limit on top of the API's own limits.
  location ~ ^/api/v1/(otp|leads|applications|callbacks|partners|grievances|credit-score) {
    limit_req zone=forms burst=10 nodelay;
    proxy_pass http://dk_api;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://dk_api;
  }
  location /_next/static/ {
    proxy_pass http://dk_web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    proxy_pass http://dk_web;
  }
}
